# Production compose. Jenkins runs it on oracle with docker-compose.oracle.yml layered on top
# (COMPOSE_PROJECT_NAME=news). Secrets come from ./.env in the Jenkins workspace, never the repo.
#
# Resource budget on the shared oracle host (portfolio already takes ~1.5 CPU / 1.5 GB there):
# about 1.2 CPU / 1.2 GB for this project.
#   web 0.6 CPU / 512m, scheduler 0.2 CPU / 256m (it only wakes hourly to run the management
#   commands in backend/services/scheduler.py).
# The database is OCI MySQL HeatWave outside this compose (ADR 0004): web and scheduler read
# DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD from .env. `make prod-local` layers
# docker-compose.prod-local.yml on top to add a local MySQL instead.
name: news

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # 운영(oracle)은 Jenkins 가 NEWS_IMAGE 로 ghcr 의 <커밋 sha> 이미지를 준다(#142). 없으면 로컬에서 빌드한다.
    image: ${NEWS_IMAGE:-news-web:latest}
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18092}:8000"
    # Hits /api/health (which round-trips to the database) with the first allowed host as Host header.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u;h=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0].strip();u.urlopen(u.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}),timeout=5)"
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    cpus: 0.6
    mem_limit: 512m
    restart: unless-stopped

  # Same image as web. `run_scheduler` runs services.scheduler.COMMANDS right at start, then on the
  # wall clock every SCHEDULER_INTERVAL seconds (default 3600) plus SCHEDULER_OFFSET (default 1500,
  # i.e. :25 past each hour, 15 minutes before the editor routine at 06:40/12:40/18:40 KST).
  # A failing command is logged and never stops the loop.
  scheduler:
    image: ${NEWS_IMAGE:-news-web:latest}
    command:
      - python
      - manage.py
      - run_scheduler
      - --interval
      - "${SCHEDULER_INTERVAL:-3600}"
      - --offset
      - "${SCHEDULER_OFFSET:-1500}"
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
    cpus: 0.2
    mem_limit: 256m
    restart: unless-stopped
