  <text x="96" y="566" font-family="Pretendard" font-size="30" font-weight="600" letter-spacing="1" fill="#1e3a8a">news.sandcorp.co.kr</text>
  <rect y="606" width="1200" height="24" fill="#1e3a8a"/>
