# PR 검사(GitHub 호스팅 실행기) — 파괴적 migrate + scripts/ci/check.sh(배포 전 검사)와 같은 것. 옛 Jenkins PR 잡(sandcorp-news-pr)을 대신한다.
# 보안: pull_request만(pull_request_target 금지), GitHub 호스팅 실행기만, 읽기 권한만, secrets 없음(시험 값은 가짜).
# 액션은 커밋 SHA로 고정한다(주석은 태그).
# main push에서는 release.yml이 이 워크플로를 workflow_call로 불러 같은 검사를 돌린다(#180) — 통과해야 이미지·production 승격으로 간다.
# 그때 github.event_name·github.ref는 부른 쪽(push, refs/heads/main) 것이라 아래 캐시 저장 조건이 그대로 main에서 돈다.
# 캐시(#177): 모든 실행이 복원(actions/cache/restore)하고 저장(actions/cache/save)은 main push에서만 한다 —
# PR에서 만든 캐시는 그 PR 안에서만 쓰여 남의 PR이 못 쓰고 저장소 10GB 한도만 먹는다. PR은 main 캐시를 복원한다.
name: PR 검사

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR은 번호마다 새 push가 옛 실행을 끊는다. main(workflow_call)은 커밋마다 따로 — 끊기면 그 sha의 승격 실행이 취소로 끝난다.
  group: pr-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # scripts/ci/check.Dockerfile과 같은 판
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  UV_VERSION: "0.12.9"
  PNPM_VERSION: "11.25.0"

jobs:
  migrate-guard:
    name: 파괴적 migrate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # PR이 새로 더한 */migrations/*.py만 본다. 통과 표시 `# sandcorp: destructive-ok — <이유>`(jenkins-shared README).
      - run: bash scripts/ci/migrate-guard.sh "origin/${{ github.base_ref }}"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g "pnpm@${PNPM_VERSION}"
      - name: pnpm store 경로
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: pnpm store 복원
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: pnpm store 저장(main만)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.path != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      NEWS_TEST_CPU_LIMIT: "1.0"
      UV_PYTHON_DOWNLOADS: never
      UV_CACHE_DIR: /home/runner/.cache/uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: production 승격 스크립트 시험
        run: bash scripts/ci/promote_test.sh
      # service container는 mysqld 인자를 못 받아 docker run으로 띄운다(scripts/ci/check.sh와 같은 옵션).
      # 이미지 pull(약 15초)을 배경으로 돌려 의존성 설치와 겹친다 — 준비는 아래 「시험 DB 준비 기다림」이 본다.
      - name: 시험 DB (mysql:26.10.0, 배경)
        run: |
          nohup docker run -d --name db -p 127.0.0.1:3306:3306 \
            -e MYSQL_DATABASE=news -e MYSQL_USER=news -e MYSQL_PASSWORD=news -e MYSQL_ROOT_PASSWORD=news-root \
            mysql:26.10.0 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_as_cs \
            --skip-log-bin --innodb-flush-log-at-trx-commit=2 --innodb-doublewrite=OFF \
            > /tmp/db-start.log 2>&1 &
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 빌드 도구(mysqlclient)와 uv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
          python -m pip install "uv==${UV_VERSION}"
      - name: uv 캐시 복원
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-uv${{ env.UV_VERSION }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-uv${{ env.UV_VERSION }}-
      # mypy 증분 캐시 — 키에 sha를 넣어 main마다 새로 저장하고, 복원은 가장 최근 것(restore-keys).
      - name: mypy 캐시 복원
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}-
      # git 의존성 sandcorp-authkit(uv.lock은 ssh://git@github.com/…)을 키 없이 https로 받는다 — 이 실행기 안에서만.
      - name: 의존성(uv sync)
        working-directory: backend
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          uv sync --frozen
      - name: uv 캐시 저장(main만)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv cache prune --ci
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-uv${{ env.UV_VERSION }}-${{ hashFiles('backend/uv.lock') }}
      - name: ruff format --check · ruff check
        working-directory: backend
        run: uv run ruff format --check . && uv run ruff check .
      - name: mypy
        working-directory: backend
        run: uv run mypy .
      - name: mypy 캐시 저장(main만)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}-${{ github.sha }}
      - name: 시험 DB 준비 기다림
        run: |
          for _ in $(seq 1 90); do
            # root로 붙는 것만으로는 초기화 중일 수 있다 — 앱 사용자로 news DB에 붙어야 준비된 것이다.
            if docker exec db mysql -unews -pnews -h127.0.0.1 -e 'SELECT 1' news >/dev/null 2>&1; then
              # pytest-django가 시험 DB(test_news*)를 만들고 지운다(deploy/mysql/dev-init.sql과 같다).
              docker exec db mysql -uroot -pnews-root -e 'GRANT ALL PRIVILEGES ON `test\_news%`.* TO '"'news'@'%'"';' 2>/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "시험 DB가 뜨지 않았다" >&2
          cat /tmp/db-start.log >&2 || true
          docker logs --tail 40 db >&2 || true
          exit 1
      - name: pytest
        working-directory: backend
        run: uv run pytest -q
